name: Build image

on:
  push:
    branches: [main]

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The ghcr.io/ohthehugemanatee/songhub package must grant this repo write
      # access (package settings, Manage Actions access), or the push gets a 403.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: the cluster's arm64 nodes are tainted
      # control-plane-only, so this workload only schedules on amd64 nodes.
      # No :latest: homenet-documentation's build-songhub-image.yaml reserves
      # it for upstream builds.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/ohthehugemanatee/songhub:main
            ghcr.io/ohthehugemanatee/songhub:sha-${{ github.sha }}
